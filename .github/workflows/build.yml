name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/dailytext/now app/src/main/res/values
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name="DailyTextNow"; include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins { id("com.android.application") version "8.7.3" apply false; id("org.jetbrains.kotlin.android") version "2.0.21" apply false }
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android { namespace="com.dailytext.now"; compileSdk=36; defaultConfig { applicationId="com.dailytext.now"; minSdk=26; targetSdk=36; versionCode=4; versionName="0.2.0" }; compileOptions { sourceCompatibility=JavaVersion.VERSION_17; targetCompatibility=JavaVersion.VERSION_17 }; kotlinOptions { jvmTarget="17" } }
          dependencies { implementation("androidx.core:core-ktx:1.17.0"); implementation("androidx.appcompat:appcompat:1.7.1"); implementation("org.jsoup:jsoup:1.18.3") }
          EOF
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="Theme.DailyTextNow" parent="Theme.AppCompat.DayNight.NoActionBar"><item name="android:fontFamily">sans</item></style></resources>
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.POST_PROMOTED_NOTIFICATIONS"/><application android:label="오늘의 성구" android:theme="@style/Theme.DailyTextNow"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > app/src/main/java/com/dailytext/now/MainActivity.kt <<'EOF'
          package com.dailytext.now
          import android.Manifest
          import android.app.*
          import android.content.*
          import android.content.pm.PackageManager
          import android.graphics.Typeface
          import android.net.Uri
          import android.os.*
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.app.NotificationCompat
          import androidx.core.content.ContextCompat
          import org.jsoup.Jsoup
          import java.time.LocalDate
          import kotlin.concurrent.thread

          class MainActivity:AppCompatActivity(){
            lateinit var verse:TextView; lateinit var ref:TextView; lateinit var progress:ProgressBar; var wolUrl=""
            override fun onCreate(b:Bundle?){super.onCreate(b);channel();screen();load()}
            fun screen(){val d=LocalDate.now();val days=listOf("월요일","화요일","수요일","목요일","금요일","토요일","일요일");wolUrl="https://wol.jw.org/ko/wol/h/r8/lp-ko/${d.year}/${d.monthValue}/${d.dayOfMonth}";val root=LinearLayout(this).apply{orientation=LinearLayout.VERTICAL;gravity=Gravity.CENTER_HORIZONTAL;setPadding(48,80,48,60)};root.addView(TextView(this).apply{text="오늘의 성구";textSize=30f;gravity=Gravity.CENTER;setTypeface(null,Typeface.BOLD)});root.addView(TextView(this).apply{text="${d.monthValue}월 ${d.dayOfMonth}일 ${days[d.dayOfWeek.value-1]}";textSize=18f;gravity=Gravity.CENTER;setPadding(0,20,0,50)});progress=ProgressBar(this);verse=TextView(this).apply{textSize=23f;gravity=Gravity.CENTER;setPadding(0,35,0,20)};ref=TextView(this).apply{textSize=18f;gravity=Gravity.CENTER;setTypeface(null,Typeface.BOLD);setPadding(0,0,0,50)};root.addView(progress);root.addView(verse);root.addView(ref);root.addView(Button(this).apply{text="WOL에서 전체 내용 읽기";setOnClickListener{startActivity(Intent(Intent.ACTION_VIEW,Uri.parse(wolUrl)))}});root.addView(Button(this).apply{text="새로고침";setOnClickListener{load()}});root.addView(Button(this).apply{text="실시간 알림 설정";setOnClickListener{openLiveSettings()}});setContentView(ScrollView(this).apply{addView(root)})}
            fun load(){progress.visibility=android.view.View.VISIBLE;verse.text="오늘의 성구를 불러오는 중...";ref.text="";thread{try{val r=fetch();runOnUiThread{progress.visibility=android.view.View.GONE;verse.text=r.first;ref.text=r.second;save(r.first,r.second);notifyNowBar(r.first,r.second)}}catch(e:Exception){runOnUiThread{progress.visibility=android.view.View.GONE;verse.text="오늘의 성구를 불러오지 못했습니다.";ref.text="WOL 연결 오류: ${e.message}"}}}}
            fun fetch():Pair<String,String>{val d=LocalDate.now();val doc=Jsoup.connect(wolUrl).userAgent("Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36").header("Accept-Language","ko-KR,ko;q=0.9").timeout(20000).get();val target="${d.monthValue}월${d.dayOfMonth}일";val h=doc.select("h1,h2,h3,h4").firstOrNull{it.text().replace(Regex("\\s"),"").contains(target)}?:throw Exception("오늘 날짜를 찾지 못했습니다");val all=doc.select("h1,h2,h3,h4,p");val hi=all.indexOf(h);if(hi<0)throw Exception("날짜 위치 오류");for(i in hi+1 until all.size){val e=all[i];if(e.tagName().matches(Regex("h[1-4]")))break;if(e.tagName()!="p")continue;val t=e.text().trim();val dash=listOf(t.indexOf('—'),t.indexOf('–')).filter{it>0}.minOrNull()?:-1;if(dash>0){val v=t.substring(0,dash).trim();val r=t.substring(dash+1).trim().trimEnd('.');if(v.isNotBlank()&&r.any{it.isDigit()})return Pair(v,r)}};throw Exception("성구를 찾지 못했습니다")}
            fun save(v:String,r:String){getSharedPreferences("daily_text",MODE_PRIVATE).edit().putString("verse",v).putString("reference",r).apply()}
            fun notifyNowBar(v:String,r:String){if(Build.VERSION.SDK_INT>=33&&ContextCompat.checkSelfPermission(this,Manifest.permission.POST_NOTIFICATIONS)!=PackageManager.PERMISSION_GRANTED){ActivityCompat.requestPermissions(this,arrayOf(Manifest.permission.POST_NOTIFICATIONS),100);return};val open=PendingIntent.getActivity(this,0,Intent(this,MainActivity::class.java),PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE);val extras=Bundle().apply{putString("android.ongoingActivityNoti.primaryInfo","오늘의 성구 · $r");putString("android.ongoingActivityNoti.secondaryInfo",v);putString("android.ongoingActivityNoti.nowbarPrimaryInfo",r);putString("android.ongoingActivityNoti.nowbarSecondaryInfo",v);putString("android.ongoingActivityNoti.chipExpandedText","오늘의 성구")};val b=NotificationCompat.Builder(this,"daily_text_live").setSmallIcon(android.R.drawable.ic_menu_info_details).setContentTitle("오늘의 성구 · $r").setContentText(v).setStyle(NotificationCompat.BigTextStyle().bigText(v)).setContentIntent(open).setOngoing(true).setOnlyAlertOnce(true).setAutoCancel(false).setPriority(NotificationCompat.PRIORITY_HIGH).setCategory(NotificationCompat.CATEGORY_STATUS).setRequestPromotedOngoing(true).addExtras(extras);getSystemService(NotificationManager::class.java).notify(1001,b.build())}
            fun openLiveSettings(){try{if(Build.VERSION.SDK_INT>=36)startActivity(Intent(Settings.ACTION_MANAGE_APP_PROMOTED_NOTIFICATIONS).apply{data=Uri.parse("package:$packageName")})else startActivity(Intent(Settings.ACTION_APP_NOTIFICATION_SETTINGS).putExtra(Settings.EXTRA_APP_PACKAGE,packageName))}catch(e:Exception){startActivity(Intent(Settings.ACTION_APP_NOTIFICATION_SETTINGS).putExtra(Settings.EXTRA_APP_PACKAGE,packageName))}}
            fun channel(){if(Build.VERSION.SDK_INT>=26){val m=getSystemService(NotificationManager::class.java);m.createNotificationChannel(NotificationChannel("daily_text_live","오늘의 성구 · 실시간",NotificationManager.IMPORTANCE_HIGH).apply{description="오늘의 성구를 잠금화면과 Now Bar에 표시";setShowBadge(false)})}}
          }
          EOF
      - name: Build Debug APK
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: daily-text-now-debug, path: app/build/outputs/apk/debug/app-debug.apk }
