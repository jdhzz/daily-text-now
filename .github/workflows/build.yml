name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/dailytext/now
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DailyTextNow"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.dailytext.now"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.dailytext.now"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "0.1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("org.jsoup:jsoup:1.18.3")
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.DailyTextNow"
                  parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:label="오늘의 성구"
                  android:theme="@style/Theme.DailyTextNow"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/dailytext/now/MainActivity.kt <<'EOF'
          package com.dailytext.now

          import android.Manifest
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Typeface
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ProgressBar
          import android.widget.ScrollView
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.app.NotificationCompat
          import androidx.core.content.ContextCompat
          import org.jsoup.Jsoup
          import java.time.LocalDate
          import kotlin.concurrent.thread

          class MainActivity : AppCompatActivity() {

              private lateinit var verseView: TextView
              private lateinit var referenceView: TextView
              private lateinit var progress: ProgressBar

              private var todayUrl = ""

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  createNotificationChannel()
                  buildScreen()
                  loadToday()
              }

              private fun buildScreen() {
                  val today = LocalDate.now()

                  val days = listOf(
                      "월요일", "화요일", "수요일", "목요일",
                      "금요일", "토요일", "일요일"
                  )

                  todayUrl =
                      "https://wol.jw.org/ko/wol/h/r8/lp-ko/" +
                      "${today.year}/${today.monthValue}/${today.dayOfMonth}"

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(48, 80, 48, 60)
                  }

                  val title = TextView(this).apply {
                      text = "오늘의 성구"
                      textSize = 30f
                      gravity = Gravity.CENTER
                      setTypeface(null, Typeface.BOLD)
                  }

                  val date = TextView(this).apply {
                      text =
                          "${today.monthValue}월 ${today.dayOfMonth}일 " +
                          days[today.dayOfWeek.value - 1]
                      textSize = 18f
                      gravity = Gravity.CENTER
                      setPadding(0, 20, 0, 50)
                  }

                  progress = ProgressBar(this)

                  verseView = TextView(this).apply {
                      text = "오늘의 성구를 불러오는 중..."
                      textSize = 23f
                      gravity = Gravity.CENTER
                      setPadding(0, 35, 0, 20)
                  }

                  referenceView = TextView(this).apply {
                      textSize = 18f
                      gravity = Gravity.CENTER
                      setTypeface(null, Typeface.BOLD)
                      setPadding(0, 0, 0, 50)
                  }

                  val wolButton = Button(this).apply {
                      text = "WOL에서 전체 내용 읽기"
                      setOnClickListener {
                          startActivity(
                              Intent(
                                  Intent.ACTION_VIEW,
                                  Uri.parse(todayUrl)
                              )
                          )
                      }
                  }

                  val refreshButton = Button(this).apply {
                      text = "새로고침"
                      setOnClickListener {
                          loadToday()
                      }
                  }

                  root.addView(title)
                  root.addView(date)
                  root.addView(progress)
                  root.addView(verseView)
                  root.addView(referenceView)
                  root.addView(wolButton)
                  root.addView(refreshButton)

                  val scroll = ScrollView(this)
                  scroll.addView(root)

                  setContentView(scroll)
              }

              private fun loadToday() {
                  progress.visibility = android.view.View.VISIBLE
                  verseView.text = "오늘의 성구를 불러오는 중..."
                  referenceView.text = ""

                  thread {
                      try {
                          val result = fetchToday()

                          runOnUiThread {
                              progress.visibility = android.view.View.GONE
                              verseView.text = result.first
                              referenceView.text = result.second

                              saveCache(result.first, result.second)
                              requestNotification(result.first, result.second)
                          }

                      } catch (e: Exception) {
                          val cache = loadCache()

                          runOnUiThread {
                              progress.visibility = android.view.View.GONE

                              if (cache != null) {
                                  verseView.text = cache.first
                                  referenceView.text = cache.second
                              } else {
                                  verseView.text =
                                      "오늘의 성구를 불러오지 못했습니다."
                                  referenceView.text =
                                      "인터넷 연결 후 새로고침해 주세요."
                              }
                          }
                      }
                  }
              }

              private fun fetchToday(): Pair<String, String> {
                  val today = LocalDate.now()

                  val doc = Jsoup.connect(todayUrl)
                      .userAgent(
                          "Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36"
                      )
                      .timeout(15000)
                      .get()

                  val target =
                      "${today.monthValue}월${today.dayOfMonth}일"

                  val heading = doc.select("h1,h2,h3")
                      .firstOrNull {
                          it.text()
                              .replace(" ", "")
                              .contains(target)
                      }
                      ?: throw Exception("오늘 날짜를 찾지 못했습니다.")

                  var current = heading.nextElementSibling()
                  var line: String? = null

                  while (current != null) {
                      if (
                          current.tagName() in listOf("h1", "h2", "h3")
                      ) {
                          break
                      }

                      val paragraphs =
                          if (current.tagName() == "p") {
                              listOf(current)
                          } else {
                              current.select("p")
                          }

                      for (paragraph in paragraphs) {
                          val text = paragraph.text().trim()

                          if (
                              text.contains("—") &&
                              text.length in 10..600
                          ) {
                              line = text
                              break
                          }
                      }

                      if (line != null) break

                      current = current.nextElementSibling()
                  }

                  val full =
                      line ?: throw Exception("성구를 찾지 못했습니다.")

                  val split = full.lastIndexOf('—')

                  if (split < 0) {
                      return Pair(full, "")
                  }

                  val verse =
                      full.substring(0, split)
                          .trim()
                          .trimEnd('.', ' ', '—')

                  val reference =
                      full.substring(split + 1).trim()

                  return Pair(verse, reference)
              }

              private fun saveCache(
                  verse: String,
                  reference: String
              ) {
                  getSharedPreferences("daily_text", MODE_PRIVATE)
                      .edit()
                      .putString("verse", verse)
                      .putString("reference", reference)
                      .apply()
              }

              private fun loadCache(): Pair<String, String>? {
                  val prefs =
                      getSharedPreferences("daily_text", MODE_PRIVATE)

                  val verse =
                      prefs.getString("verse", null)
                          ?: return null

                  val reference =
                      prefs.getString("reference", "") ?: ""

                  return Pair(verse, reference)
              }

              private fun requestNotification(
                  verse: String,
                  reference: String
              ) {
                  if (
                      Build.VERSION.SDK_INT >= 33 &&
                      ContextCompat.checkSelfPermission(
                          this,
                          Manifest.permission.POST_NOTIFICATIONS
                      ) != PackageManager.PERMISSION_GRANTED
                  ) {
                      ActivityCompat.requestPermissions(
                          this,
                          arrayOf(Manifest.permission.POST_NOTIFICATIONS),
                          100
                      )
                      return
                  }

                  showNotification(verse, reference)
              }

              private fun showNotification(
                  verse: String,
                  reference: String
              ) {
                  val notification =
                      NotificationCompat.Builder(
                          this,
                          "daily_text"
                      )
                          .setSmallIcon(
                              android.R.drawable.ic_dialog_info
                          )
                          .setContentTitle(
                              "오늘의 성구 · $reference"
                          )
                          .setContentText(verse)
                          .setStyle(
                              NotificationCompat.BigTextStyle()
                                  .bigText(verse)
                          )
                          .setPriority(
                              NotificationCompat.PRIORITY_HIGH
                          )
                          .setAutoCancel(false)
                          .build()

                  val manager =
                      getSystemService(
                          NotificationManager::class.java
                      )

                  manager.notify(1001, notification)
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      val channel =
                          NotificationChannel(
                              "daily_text",
                              "오늘의 성구",
                              NotificationManager.IMPORTANCE_HIGH
                          ).apply {
                              description =
                                  "오늘의 성구 알림"
                          }

                      getSystemService(
                          NotificationManager::class.java
                      ).createNotificationChannel(channel)
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daily-text-now-debug
          path: app/build/outputs/apk/debug/app-debug.apk
